# Web server for the built site. The cache rules are what make a new deploy
# reach every visitor without anyone clearing their browser cache.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Built code and styles. Vite gives these a new file name on every build,
  # so browsers may keep them for a year: a new deploy never reuses a name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker scripts: always checked for a new version, so updates (and
  # the clean-up worker in sw.js) reach browsers on their next visit.
  location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Pages and everything else: the browser keeps a copy but must check for a
  # newer one each time (a cheap "not modified" reply when nothing changed).
  # This is what stops index.html pointing at last week's code.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
